  # 5. Cortex Service (L3): AllenAI Olmo-3-7B-Think (Reasoning)
  cortex-service:
    image: nvcr.io/nvidia/vllm:25.12.post1-py3
    depends_on:
      tts-service:
        condition: service_healthy
    runtime: nvidia
    restart: unless-stopped
    ipc: host
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - VLLM_USE_FLASHINFER_MOE_FP4=0 # Disable FP4 for Llama
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - MAX_JOBS=12
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ~/.cache/vllm:/root/.cache/vllm
      - ./scripts/start_cortex.sh:/opt/start_cortex.sh
      - ./models/cortex:/models/config # For storing the parser script
    ports:
      - "8000:8000"
    shm_size: '16gb'
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    entrypoint: ["/bin/bash", "/opt/start_cortex.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 900s

