  # 2. TTS Service (Chatterbox-Turbo - Quint Persona)
  tts-service:
    build:
      context: .
      dockerfile: docker/voice/Dockerfile
    image: lhzn/chatterbox:thor
    depends_on:
      front-end-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    container_name: tts-service
    runtime: nvidia
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      #- VOICE_REF_FILE=quint-processed.wav
      #- VOICE_REF_FILE=ahab-life-amid-mild-seas.wav
      - VOICE_REF_FILE=jerry_seinfeld_prompt.wav
      #- VOICE_REF_FILE=juan-soto-optimized.wav
    volumes:
      - ./config:/app/config
      - ./src/voice:/app/src/voice
    ports:
      - "8003:8000"
    networks:
      - agent-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # 3. Front-End (L1): Gemma-3-4B
  front-end-service:
    image: ghcr.io/nvidia-ai-iot/vllm:latest-jetson-thor
    container_name: front-end-service
    runtime: nvidia
    restart: unless-stopped
    ipc: host
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    entrypoint: ["/bin/bash", "-c", "export PIP_CONSTRAINT= && pip install xformers --extra-index-url https://pypi.jetson-ai-lab.io/sbsa/cu130 && pip install --pre triton --find-links https://download.pytorch.org/whl/nightly/cu130/triton/ && pip install soundfile==0.12.1 librosa && pip install -U huggingface_hub mistral_common && pip uninstall -y transformers && pip install git+https://github.com/huggingface/transformers.git -c /dev/null --no-deps && python3 -m vllm.entrypoints.openai.api_server \"$@\"", "--"]
    command: >
      --model google/gemma-4-E4B-it
      --kv-cache-dtype fp8
      --dtype bfloat16 
      --gpu-memory-utilization 0.25
      --enforce-eager
      --limit-mm-per-prompt '{"image": 4, "audio": 1}'
      --max-model-len 4096
      --host 0.0.0.0
      --port 8001
    ports:
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 900s

