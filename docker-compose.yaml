  # 6. Watchstander Service (Sentinel Mode + Dashboard)
  watchstander:
    container_name: watchstander
    build:
      context: .
      dockerfile: src/watchstander/Dockerfile.vision
    image: chatty-buoy/vision:latest
    runtime: nvidia
    restart: unless-stopped
    shm_size: '2gb'
    ports:
      - "8080:8080" # Web Dashboard
    environment:
      # --- Camera Source Configuration ---
      - RTSP_URL=v4l2:///dev/video0
      - REDIS_HOST=redis
      - COSMOS_VLLM_URL=http://cosmos-vision:8010/v1/chat/completions
      - COSMOS_MODEL_NAME=nvidia/cosmos-reason2-2b-fp8
      - VISION_MODE=${VISION_MODE:-marine}
    volumes:
      - ./models/vision:/root/.config/Ultralytics
      - ./models/vision:/app/models
      - ./data/videos:/app/data/videos # For Local file testing
      - ./yolo26n.pt:/app/yolo26n.pt
      - ./src/watchstander/watchstander.py:/app/watchstander.py # Dev Mount
      - ./src/watchstander/web_dashboard.py:/app/web_dashboard.py # Dev Mount
    devices:
      - "/dev/video0:/dev/video0"
    networks:
      - agent-net
    depends_on:
      cosmos-vision:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # 7. Redis for Event Bus
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - agent-net

  # 8. Vector Database (pgvector)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agentbufferpassword
      POSTGRES_DB: agent_memory
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - agent-net

  # 11. Agent Orchestrator (FastAPI Daemon)
  first-mate:
    container_name: first-mate
    build:
      context: .
      dockerfile: containers/orchestrator/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - L1_URI=http://front-end-service:8001/v1/chat/completions
      - L1_MODEL=/root/.cache/huggingface/hub/models--google--gemma-4-E4B-it/snapshots/292a7e278a400932df35f9fd4b1501edd04133a5
      - ENABLE_RAG=true
      - PG_HOST=postgres
      - CORTEX_ENABLED=true
      - CORTEX_BASE_URL=http://front-end-service:8001/v1
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - agent-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      front-end-service:
        condition: service_healthy
      redis:
        condition: service_started

  # 12. Hardware Audio CLI
  audio-cli:
    container_name: audio-cli
    build:
      context: .
      dockerfile: containers/audio/Dockerfile
    restart: always
    privileged: true
    environment:
      - ORCHESTRATOR_HOST=first-mate
      - ORCHESTRATOR_PORT=8000
      - L1_HOST=front-end-service
      - L1_PORT=8001
      - TTS_HOST=tts-service
      - TTS_PORT=8000
      - TTS_SAMPLE_RATE=24000
    devices:
      - "/dev/snd:/dev/snd"
    volumes:
      - ./.env:/app/.env:ro
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./models:/app/models
    networks:
      - agent-net
    depends_on:
      - first-mate
      - tts-service

