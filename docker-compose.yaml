  # 2. TTS Service (Chatterbox-Turbo - Quint Persona)
  tts-service:
    build:
      context: .
      dockerfile: docker/voice/Dockerfile
    image: lhzn/chatterbox:thor
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    container_name: tts-service
    runtime: nvidia
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - VOICE_REF_FILE=quint1.wav
      - LOG_LEVEL=INFO
      - HF_HUB_OFFLINE=1
      #- VOICE_REF_FILE=jerry_seinfeld_prompt.wav
    volumes:
      - ./config:/app/config
      - ./src/voice:/app/src/voice
      - ~/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8003:8000"
    networks:
      - agent-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # 3. Front-End (L1): Gemma-4-E4B-Multimodal
  front-end-service:
    image: ghcr.io/nvidia-ai-iot/vllm:gemma4-jetson-thor
    container_name: front-end-service
    runtime: nvidia
    restart: unless-stopped
    ipc: host
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_OFFLINE=1
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    entrypoint: [
      "vllm", "serve", "/root/.cache/huggingface/hub/models--google--gemma-4-E4B-it/snapshots/292a7e278a400932df35f9fd4b1501edd04133a5",
      "--gpu-memory-utilization", "0.15",
      "--max-model-len", "4096",
      "--enable-auto-tool-choice",
      "--reasoning-parser", "gemma4",
      "--enforce-eager",
      "--tool-call-parser", "gemma4",
      "--host", "0.0.0.0",
      "--port", "8001"
    ]
    ports:
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 900s
    networks:
      - agent-net


  # 4. Cosmos Vision Sentinel Service (L3): Multimodal Reasoning (Cosmos Reason 2 2B run out-of-band)
  cosmos-vision:
    image: ghcr.io/nvidia-ai-iot/vllm:0.14.0-r38.3-arm64-sbsa-cu130-24.04
    container_name: cosmos-vision
    runtime: nvidia
    restart: unless-stopped
    ipc: host
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - HF_HOME=/data/models/huggingface
      - HF_HUB_OFFLINE=1
    volumes:
      - ~/.cache/huggingface:/data/models/huggingface
      - ~/.cache/vllm:/root/.cache/vllm
    entrypoint: [
      "vllm", "serve", "nvidia/Cosmos-Reason2-2B",
      "--served-model-name", "nvidia/cosmos-reason2-2b-fp8",
      "--trust-remote-code",
      "--gpu-memory-utilization", "0.20",
      "--max-model-len", "8192",
      "--media-io-kwargs", "{\"video\": {\"num_frames\": -1}}",
      "--reasoning-parser", "qwen3",
      "--enable-prefix-caching",
      "--host", "0.0.0.0",
      "--port", "8010"
    ]
    ports:
      - "8010:8010"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8010/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 900s
    networks:
      - agent-net

