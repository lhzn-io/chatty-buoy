services:
  personaplex:
    build:
      context: ../../
      dockerfile: containers/crew/Dockerfile
    image: personaplex:latest
    container_name: personaplex
    runtime: nvidia
    ipc: host
    ports:
      - "8998:8998"
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    devices:
      - /dev/snd:/dev/snd
    volumes:
      # Mount the HF cache from the host to avoid re-downloading models
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      # Mount the headless script for live development
      - ./quint_headless.py:/app/quint_headless.py
      # Optional: Mount the source code for development (uncomment to user)
      # - ../../vendor/personaplex/moshi:/app/moshi
