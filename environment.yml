# chatty-buoy micromamba environment (Optimized for Thor/Blackwell)
name: chatty-buoy
channels:
  - conda-forge
  - nvidia
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - cmake>=3.25
  - rust
  - nvidia::cuda-runtime=13.0
  - conda-forge::cudnn>=9.0
  - conda-forge::libstdcxx-ng>=12.0
  - libsndfile
  - portaudio
  - pygobject
  - gst-python
  - pip:
      - torchvision
      - redis
      - nvidia-cudss-cu13
      - nvpl-blas
      - nvpl-lapack
      - ultralytics
      - jetson-stats
      - opencv-python
      - nvidia-riva-client
      - sounddevice
      - soundfile
      - openai
      - semantic-router
      - transformers
